<title>Kites and Threads · Workflow</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; }
  header { background: #1d1d1f; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 12px; }
  .logo { width: 200px; height: 26px; overflow: hidden; position: relative; flex: none; }
  .logo img { position: absolute; width: 286px; left: -43px; top: -120px; max-width: none; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  section { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 14px 0 6px; text-transform: uppercase; color: #6e6e73; }
  input, select, button { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid #c7c7cc; }
  input, select { width: 100%; margin: 3px 0 8px; }
  button { background: #fff; cursor: pointer; }
  button.primary { background: #0a84ff; color: #fff; border-color: #0a84ff; }
  button.danger { color: #d70015; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .card { border: 1px solid #e5e5ea; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .card.active { border-color: #0a84ff; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #e5e5ea; }
  .stage-JOB_ACCEPTED { background: #d1f0d6; } .stage-MAIN_SHOOT { background: #ffe9b3; } .stage-JOB_COMPLETE { background: #c9d9ff; }
  .task { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #f0f0f3; }
  .task.overdue { color: #d70015; }
  .muted { color: #6e6e73; font-size: 12px; }
  .stages { display: flex; gap: 4px; margin-bottom: 10px; }
  .stages div { flex: 1; text-align: center; padding: 6px 2px; font-size: 12px; border-radius: 6px; background: #f0f0f3; }
  .stages div.on { background: #0a84ff; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 4px; border-bottom: 1px solid #f0f0f3; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>

<script>
// Pure workflow logic. No DOM, no dependencies. Works in browsers and Node.
(function (root) {
  'use strict';

  // Milestones, in order. Lead Created is the start; Job Complete is manual.
  const MILESTONES = ['LEAD_CREATED', 'JOB_ACCEPTED', 'MAIN_SHOOT', 'JOB_COMPLETE'];
  const STAGE_LABELS = {
    LEAD_CREATED: 'Lead',
    JOB_ACCEPTED: 'Job Accepted',
    MAIN_SHOOT: 'Main Shoot',
    JOB_COMPLETE: 'Job Complete',
  };
  const TASK_TYPES = ['todo', 'email', 'extra_shoot', 'appointment'];

  const DAY_MS = 24 * 60 * 60 * 1000;

  function uid(prefix) {
    return prefix + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  // A job type carries a workflow template. Each template task is anchored to a
  // milestone and offset in days (negative = before, positive = after).
  // autoSend: email tasks with a due date are sent automatically when due.
  function makeJobType(name, color, template) {
    return { id: uid('jt'), name, color: color || '#888888', template: template || [] };
  }

  function makeTemplateTask(title, type, anchor, offsetDays, extra) {
    if (!TASK_TYPES.includes(type)) throw new Error('Unknown task type: ' + type);
    if (anchor && !MILESTONES.includes(anchor)) throw new Error('Unknown milestone: ' + anchor);
    return Object.assign({ title, type, anchor: anchor || null, offsetDays: offsetDays || 0, autoSend: false }, extra || {});
  }

  function createRecord(input, jobType, now) {
    const created = now ? new Date(now) : new Date();
    const rec = {
      id: uid('rec'),
      name: input.name,
      client: { name: input.clientName || '', email: input.clientEmail || '' },
      jobTypeId: jobType ? jobType.id : null,
      shootDate: input.shootDate ? new Date(input.shootDate).toISOString() : null,
      stage: 'LEAD_CREATED',
      milestoneDates: { LEAD_CREATED: created.toISOString() },
      tasks: [],
      quotes: [],
      invoices: [],
      payments: [],
      emailLog: [],
      notes: input.notes || '',
    };
    if (jobType) rec.tasks = buildTasks(rec, jobType);
    return rec;
  }

  // Resolve a task's due date from its anchor milestone's date (or shoot date).
  function resolveDueDate(rec, task) {
    let base;
    if (task.anchor === 'MAIN_SHOOT') base = rec.shootDate || rec.milestoneDates.MAIN_SHOOT;
    else base = rec.milestoneDates[task.anchor];
    if (!base) return null; // anchor not reached yet, no due date
    return new Date(new Date(base).getTime() + (task.offsetDays || 0) * DAY_MS).toISOString();
  }

  function buildTasks(rec, jobType) {
    return jobType.template.map((t) => ({
      id: uid('task'),
      title: t.title,
      type: t.type,
      anchor: t.anchor,
      offsetDays: t.offsetDays,
      autoSend: !!t.autoSend,
      emailTemplate: t.emailTemplate || null,
      done: false,
      sent: false,
      dueDate: resolveDueDate(rec, t),
    }));
  }

  // Move the record to a milestone (never backwards). Records the date, then
  // recomputes task due dates against the new anchors.
  function reachMilestone(rec, milestone, now) {
    if (!MILESTONES.includes(milestone)) throw new Error('Unknown milestone: ' + milestone);
    const idx = MILESTONES.indexOf(milestone);
    if (idx <= MILESTONES.indexOf(rec.stage)) return rec;
    rec.stage = milestone;
    rec.milestoneDates[milestone] = (now ? new Date(now) : new Date()).toISOString();
    rec.tasks.forEach((t) => {
      if (!t.done) t.dueDate = resolveDueDate(rec, t);
    });
    return rec;
  }

  // Quotes: pick-and-choose (client picks one package) or fixed (fixed line items).
  function makeQuote(rec, kind, lines, options) {
    if (!['pick_choose', 'fixed'].includes(kind)) throw new Error('Unknown quote kind: ' + kind);
    const quote = {
      id: uid('q'),
      kind,
      lines: lines.map((l) => ({ label: l.label, price: Number(l.price) || 0 })),
      status: 'sent',
      depositPercent: options && options.depositPercent ? Number(options.depositPercent) : 0,
      autoInvoice: !options || options.autoInvoice !== false,
    };
    rec.quotes.push(quote);
    return quote;
  }

  function quoteTotal(quote) {
    return quote.lines.reduce((s, l) => s + l.price, 0);
  }

  // Accepting a quote moves the lead to Job Accepted and (by default) creates invoices.
  function acceptQuote(rec, quoteId, now) {
    const quote = rec.quotes.find((q) => q.id === quoteId);
    if (!quote) throw new Error('No such quote');
    if (quote.status === 'accepted') return rec;
    quote.status = 'accepted';
    if (quote.autoInvoice) createInvoices(rec, quote, now);
    reachMilestone(rec, 'JOB_ACCEPTED', now);
    return rec;
  }

  // Payment schedule: a deposit now, and the balance due before the shoot.
  function createInvoices(rec, quote, now) {
    const total = quoteTotal(quote);
    const depositAmount = Math.round(total * (quote.depositPercent / 100) * 100) / 100;
    const base = now ? new Date(now) : new Date();
    const schedule = [];
    if (depositAmount > 0 && depositAmount < total) {
      schedule.push({ id: uid('inv'), label: 'Deposit', amount: depositAmount, dueDate: base.toISOString() });
      schedule.push({ id: uid('inv'), label: 'Balance', amount: Math.round((total - depositAmount) * 100) / 100, dueDate: null, beforeShoot: true });
    } else {
      schedule.push({ id: uid('inv'), label: 'Full payment', amount: total, dueDate: null });
    }
    schedule.forEach((i) => { i.paid = 0; rec.invoices.push(i); });
    return schedule;
  }

  function invoiceTotal(rec) {
    return rec.invoices.reduce((s, i) => s + i.amount, 0);
  }

  function amountPaid(rec) {
    return rec.payments.reduce((s, p) => s + p.amount, 0);
  }

  function balanceDue(rec) {
    return Math.max(0, Math.round((invoiceTotal(rec) - amountPaid(rec)) * 100) / 100);
  }

  // Record a payment. Any payment on an accepted job marks it accepted, which
  // mirrors "pays an invoice" as a Job Accepted trigger.
  function recordPayment(rec, amount, now) {
    const amt = Number(amount);
    if (!(amt > 0)) throw new Error('Payment must be positive');
    rec.payments.push({ id: uid('pay'), amount: amt, date: (now ? new Date(now) : new Date()).toISOString() });
    if (rec.invoices.length && amountPaid(rec) > 0) reachMilestone(rec, 'JOB_ACCEPTED', now);
    return rec;
  }

  function markMilestoneManual(rec, milestone, now) {
    return reachMilestone(rec, milestone, now);
  }

  // Automatic milestones driven by the clock: the shoot date moves the job to Main Shoot.
  function applyClock(rec, now) {
    const t = (now ? new Date(now) : new Date()).getTime();
    if (rec.shootDate && t >= new Date(rec.shootDate).getTime() && MILESTONES.indexOf(rec.stage) < MILESTONES.indexOf('MAIN_SHOOT')) {
      if (MILESTONES.indexOf(rec.stage) >= MILESTONES.indexOf('JOB_ACCEPTED')) {
        reachMilestone(rec, 'MAIN_SHOOT', now);
      }
    }
    return rec;
  }

  // Send any due auto-send email tasks. Returns the number of emails sent.
  // Tasks without a due date are never auto-sent; staff must check them manually.
  function runAutomations(rec, now) {
    const t = (now ? new Date(now) : new Date()).getTime();
    let sent = 0;
    rec.tasks.forEach((task) => {
      if (task.type !== 'email' || !task.autoSend || task.sent || task.done) return;
      if (!task.dueDate) return;
      if (new Date(task.dueDate).getTime() <= t) {
        task.sent = true;
        task.done = true;
        rec.emailLog.push({
          at: (now ? new Date(now) : new Date()).toISOString(),
          to: rec.client.email,
          subject: task.title,
          template: task.emailTemplate,
        });
        sent++;
      }
    });
    return sent;
  }

  function runAllAutomations(records, now) {
    return records.reduce((s, r) => s + runAutomations(r, now), 0);
  }

  // Tasks that are open and past due, for a checklist view.
  function overdueTasks(rec, now) {
    const t = (now ? new Date(now) : new Date()).getTime();
    return rec.tasks.filter((task) => !task.done && task.dueDate && new Date(task.dueDate).getTime() < t);
  }

  function stageLabel(stage) {
    return STAGE_LABELS[stage] || stage;
  }

  // Serialize / parse the whole workspace for offline backup.
  function exportData(state) {
    return JSON.stringify({ version: 1, ...state }, null, 2);
  }

  function importData(json) {
    const data = JSON.parse(json);
    if (!data || data.version !== 1 || !Array.isArray(data.records) || !Array.isArray(data.jobTypes)) {
      throw new Error('Not a valid Kites and Threads workflow backup');
    }
    return { jobTypes: data.jobTypes, records: data.records };
  }

  const api = {
    MILESTONES, STAGE_LABELS, TASK_TYPES, DAY_MS,
    makeJobType, makeTemplateTask, createRecord, buildTasks, resolveDueDate,
    reachMilestone, makeQuote, quoteTotal, acceptQuote, createInvoices,
    invoiceTotal, amountPaid, balanceDue, recordPayment, markMilestoneManual,
    applyClock, runAutomations, runAllAutomations, overdueTasks, stageLabel,
    exportData, importData,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.KitesThreadsWorkflow = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  const W = window.KitesThreadsWorkflow;
  const KEY = 'kites-and-threads-workflow:v1';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (iso) => (iso ? new Date(iso).toLocaleString() : '—');
  const money = (n) => '$' + Number(n || 0).toFixed(2);

  function defaultState() {
    const wedding = W.makeJobType('Wedding Film & Photos', '#e11d48', [
      W.makeTemplateTask('Send questionnaire (couple story, timeline, families)', 'email', 'LEAD_CREATED', 2, { autoSend: true, emailTemplate: 'questionnaire' }),
      W.makeTemplateTask('Send contract & advance invoice', 'email', 'JOB_ACCEPTED', 1, { autoSend: false, emailTemplate: 'contract' }),
      W.makeTemplateTask('Book second shooter / drone / videographer', 'extra_shoot', 'JOB_ACCEPTED', 0),
      W.makeTemplateTask('Send pre-wedding checklist to couple', 'email', 'MAIN_SHOOT', -7, { autoSend: true, emailTemplate: 'reminder' }),
      W.makeTemplateTask('Edit & deliver film teaser + highlights', 'todo', 'MAIN_SHOOT', 30),
    ]);
    const preWedding = W.makeJobType('Pre-Wedding / Couple Shoot', '#f59e0b', [
      W.makeTemplateTask('Send questionnaire & mood board request', 'email', 'LEAD_CREATED', 0, { autoSend: true, emailTemplate: 'questionnaire' }),
      W.makeTemplateTask('Send location & outfit guide', 'email', 'MAIN_SHOOT', -5, { autoSend: true, emailTemplate: 'reminder' }),
      W.makeTemplateTask('Edit & deliver photos', 'todo', 'MAIN_SHOOT', 10),
    ]);
    const portrait = W.makeJobType('Portrait Session', '#0a84ff', [
      W.makeTemplateTask('Send questionnaire', 'email', 'LEAD_CREATED', 0, { autoSend: true, emailTemplate: 'questionnaire' }),
      W.makeTemplateTask('Edit photos', 'todo', 'MAIN_SHOOT', 7),
    ]);
    return { jobTypes: [wedding, preWedding, portrait], records: [], selectedId: null };
  }

  let state;
  function load() {
    try { state = JSON.parse(localStorage.getItem(KEY)) || defaultState(); }
    catch (e) { state = defaultState(); }
    if (!state.jobTypes || !state.records) state = defaultState();
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  const jobType = (id) => state.jobTypes.find((j) => j.id === id);
  const record = (id) => state.records.find((r) => r.id === id);

  function renderJobTypeSelect() {
    $('#jobTypeSelect').innerHTML = state.jobTypes
      .map((j) => `<option value="${esc(j.id)}">${esc(j.name)}</option>`).join('');
  }

  function renderList() {
    const now = new Date();
    $('#list').innerHTML = state.records.length ? state.records.slice().reverse().map((r) => {
      const jt = jobType(r.jobTypeId);
      const od = W.overdueTasks(r, now).length;
      return `<div class="card ${r.id === state.selectedId ? 'active' : ''}" data-id="${esc(r.id)}">
        <strong>${esc(r.name)}</strong>
        <div class="muted">${esc(jt ? jt.name : 'No job type')} · shoot ${esc(fmt(r.shootDate))}</div>
        <span class="pill stage-${esc(r.stage)}">${esc(W.stageLabel(r.stage))}</span>
        ${od ? `<span class="pill" style="background:#ffd6d9">${od} overdue</span>` : ''}
      </div>`;
    }).join('') : '<p class="muted">No leads yet.</p>';
  }

  function renderDetail() {
    const r = record(state.selectedId);
    if (!r) { $('#detail').innerHTML = '<p class="muted">Select a lead or job.</p>'; return; }
    const now = new Date();
    const stages = W.MILESTONES.map((m) => {
      const on = W.MILESTONES.indexOf(m) <= W.MILESTONES.indexOf(r.stage);
      return `<div class="${on ? 'on' : ''}">${esc(W.stageLabel(m))}</div>`;
    }).join('');
    const tasks = r.tasks.map((t) => {
      const late = !t.done && t.dueDate && new Date(t.dueDate) < now;
      const mode = t.type === 'email' && t.autoSend ? 'auto' : 'manual';
      return `<label class="task ${late ? 'overdue' : ''}">
        <input type="checkbox" data-task="${esc(t.id)}" ${t.done ? 'checked' : ''}>
        <span style="flex:1">${esc(t.title)} <span class="muted">[${esc(t.type)}, ${mode}]</span></span>
        <span class="muted">${t.dueDate ? 'due ' + esc(fmt(t.dueDate)) : t.anchor ? 'waiting for ' + esc(W.stageLabel(t.anchor)) : ''}</span>
      </label>`;
    }).join('') || '<p class="muted">No workflow tasks (no job type).</p>';
    const quotes = r.quotes.map((q) => `<div class="card">
        <strong>${esc(q.kind === 'fixed' ? 'Fixed quote' : 'Pick & choose quote')}</strong> · ${money(W.quoteTotal(q))} · <span class="pill">${esc(q.status)}</span>
        ${q.status !== 'accepted' ? `<div class="row" style="margin-top:6px"><button data-accept="${esc(q.id)}" class="primary">Client accepted</button></div>` : ''}
      </div>`).join('') || '<p class="muted">No quotes yet.</p>';
    const invoices = r.invoices.length ? `<table><tr><th>Invoice</th><th>Amount</th></tr>${r.invoices.map((i) => `<tr><td>${esc(i.label)}</td><td>${money(i.amount)}</td></tr>`).join('')}</table>
      <p>Paid ${money(W.amountPaid(r))} · <strong>Balance ${money(W.balanceDue(r))}</strong></p>` : '<p class="muted">No invoices.</p>';
    const emails = r.emailLog.length ? r.emailLog.slice().reverse().map((e) => `<div class="task"><span>${esc(e.subject)}</span><span class="muted">to ${esc(e.to || '—')} · ${esc(fmt(e.at))}</span></div>`).join('') : '<p class="muted">No automated emails sent yet.</p>';

    $('#detail').innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">${esc(r.name)}</h2>
        <button class="danger" data-delete>Delete</button>
      </div>
      <p class="muted">${esc(r.client.name)} ${esc(r.client.email)} · ${esc(r.notes)}</p>
      <div class="stages">${stages}</div>
      <div class="row">
        <button data-milestone="JOB_COMPLETE">Mark Job Complete</button>
        <button data-milestone="MAIN_SHOOT">Mark Main Shoot done</button>
      </div>

      <h3>Workflow</h3>${tasks}

      <h3>Quotes</h3>
      <form id="quoteForm" class="row" style="align-items:flex-end">
        <select name="kind" style="width:auto"><option value="fixed">Fixed</option><option value="pick_choose">Pick &amp; choose</option></select>
        <input name="label" placeholder="Package" style="width:160px">
        <input name="price" type="number" min="0" step="0.01" placeholder="Price" style="width:110px">
        <input name="deposit" type="number" min="0" max="100" placeholder="Deposit %" style="width:110px">
        <button type="submit">Add quote</button>
      </form>
      ${quotes}

      <h3>Invoices & payments</h3>
      ${invoices}
      <form id="payForm" class="row" style="align-items:flex-end">
        <input name="amount" type="number" min="0.01" step="0.01" placeholder="Payment amount" style="width:180px">
        <button type="submit">Record payment</button>
      </form>

      <h3>Automated email log</h3>${emails}
      `;
  }

  function renderAll() { renderJobTypeSelect(); renderList(); renderDetail(); }

  function act(fn) {
    try { fn(); save(); renderAll(); }
    catch (e) { alert(e.message); }
  }

  $('#leadForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    act(() => {
      const jt = jobType(f.get('jobTypeId'));
      const r = W.createRecord({
        name: f.get('name'), clientName: f.get('clientName'), clientEmail: f.get('clientEmail'),
        shootDate: f.get('shootDate') || null, notes: f.get('notes'),
      }, jt);
      state.records.push(r);
      state.selectedId = r.id;
      ev.target.reset();
    });
  });

  $('#list').addEventListener('click', (ev) => {
    const card = ev.target.closest('[data-id]');
    if (card) { state.selectedId = card.dataset.id; save(); renderAll(); }
  });

  $('#detail').addEventListener('click', (ev) => {
    const r = record(state.selectedId);
    if (!r) return;
    const t = ev.target;
    if (t.matches('[data-delete]')) {
      if (!confirm('Delete this lead/job?')) return;
      act(() => { state.records = state.records.filter((x) => x.id !== r.id); state.selectedId = null; });
    } else if (t.dataset.milestone) {
      act(() => W.markMilestoneManual(r, t.dataset.milestone));
    } else if (t.dataset.accept) {
      act(() => W.acceptQuote(r, t.dataset.accept));
    }
  });

  $('#detail').addEventListener('change', (ev) => {
    const r = record(state.selectedId);
    if (!r || !ev.target.dataset.task) return;
    act(() => {
      const task = r.tasks.find((x) => x.id === ev.target.dataset.task);
      task.done = ev.target.checked;
    });
  });

  $('#detail').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const r = record(state.selectedId);
    if (!r) return;
    const f = new FormData(ev.target);
    if (ev.target.id === 'quoteForm') {
      act(() => {
        W.makeQuote(r, f.get('kind'), [{ label: f.get('label') || 'Package', price: f.get('price') || 0 }],
          { depositPercent: f.get('deposit') || 0 });
      });
    } else if (ev.target.id === 'payForm') {
      act(() => W.recordPayment(r, f.get('amount')));
    }
  });

  $('#runAuto').addEventListener('click', () => {
    act(() => {
      state.records.forEach((r) => W.applyClock(r));
      const n = W.runAllAutomations(state.records);
      alert(n ? `Sent ${n} automated email(s).` : 'No automated emails were due.');
    });
  });

  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([W.exportData({ jobTypes: state.jobTypes, records: state.records })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kites-and-threads-workflow-backup.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    file.text().then((txt) => {
      const data = W.importData(txt);
      state.jobTypes = data.jobTypes; state.records = data.records; state.selectedId = null;
      save(); renderAll();
    }).catch((e) => alert('Import failed: ' + e.message));
    ev.target.value = '';
  });

  // LAN sync: push/pull the whole backup to the sync-server.js on this network.
  const SYNC_KEY = 'ktWorkflowSyncUrl';
  $('#syncUrl').value = localStorage.getItem(SYNC_KEY) || (location.protocol.startsWith('http') ? location.origin : '');
  $('#syncUrl').addEventListener('change', (e) => localStorage.setItem(SYNC_KEY, e.target.value.trim()));
  const syncBase = () => {
    const u = $('#syncUrl').value.trim().replace(/\/+$/, '');
    if (!u) throw new Error('Enter the sync server address first.');
    return u;
  };
  async function pushSync() {
    const base = syncBase();
    if (!confirm('Overwrite the server copy with this device\'s data?')) return;
    const body = W.exportData({ jobTypes: state.jobTypes, records: state.records });
    const r = await fetch(base + '/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
    if (!r.ok) throw new Error(await r.text());
    alert('Pushed to server.');
  }
  async function pullSync() {
    const base = syncBase();
    if (!confirm('Replace this device\'s data with the server copy?')) return;
    const r = await fetch(base + '/api/state', { cache: 'no-store' });
    if (r.status === 404) throw new Error('The server has no data yet. Push from a device first.');
    if (!r.ok) throw new Error(await r.text());
    const data = W.importData(await r.text());
    state.jobTypes = data.jobTypes; state.records = data.records; state.selectedId = null;
    save(); renderAll();
    alert('Pulled from server.');
  }
  $('#pushBtn').addEventListener('click', () => pushSync().catch((e) => alert('Push failed: ' + e.message)));
  $('#pullBtn').addEventListener('click', () => pullSync().catch((e) => alert('Pull failed: ' + e.message)));

  load();
  renderAll();
})();
</script>
</body>
</html>
